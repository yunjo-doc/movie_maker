pipeline:
  output_dir: "output"
  log_level: "INFO"
  max_retries: 3

script:
  model: "claude-sonnet-5-5"
  chapters: 6
  chars_per_chapter: 750          # 6챕터 × 750자 ≈ 4500자 ≈ 10분
  target_duration_minutes: 10     # 목표 영상 길이 (분)
  style: "균형 잡힌 분석, 쉬운 설명, 신뢰감 있는 정보 전달"

tts:
  primary: "openai"
  fallback: "edge"
  openai:
    model: "tts-1-hd"               # tts-1 (빠름) 또는 tts-1-hd (고품질)
    voice: "onyx"                    # alloy, echo, fable, onyx, nova, shimmer
    speed: 1.15                      # 0.25~4.0 (1.1~1.2 권장)
  edge:
    voice: "ko-KR-HyunsuNeural"     # 최신 자연스러운 남성 음성
    rate: "+15%"
    words_in_cue: 5
  elevenlabs:
    voice_id: "OEaq3WGNtNvFJ5co9mJE"  # SangHo (상호) - 남성, 내레이션/스토리
    model_id: "eleven_multilingual_v2"
    stability: 0.5
    similarity_boost: 0.75

images:
  model: "imagen-4.0-generate-001"
  batch_delay: 6.0
  max_retries: 3
  fallback_to_stock: true

  # 스타일 프리셋 (스토리보드 + 이미지 생성 모두에 적용)
  # 변경하면 이후 모든 영상의 그림 스타일이 바뀜
  style_preset: "minimal_infographic"
  style_description: "미니멀 인포그래픽 스타일, 흰 배경, 블루/그레이 색상, 데이터 시각화, 플랫 디자인"
  style_suffix: ", minimalist infographic style, clean white background, modern data visualization, flat design icons, subtle blue and gray color palette, professional chart graphics, clean typography, simple geometric shapes"

  # 고정 캐릭터 묘사 (선택, 비워두면 사용 안 함)
  # 인물이 반복 등장하는 채널이면 여기에 외모를 고정
  character_sheet: ""
  # 예시: "A young Korean woman, mid-20s, shoulder-length black hair, warm brown eyes, navy blazer, white blouse"

  # 사용 가능한 프리셋 참고:
  # cinematic_documentary: 시네마틱 다큐, 영화적 조명
  # digital_illustration: 디지털 일러스트, 따뜻한 색감
  # anime_ghibli: 지브리풍 애니메이션, 파스텔톤
  # webtoon: 한국 웹툰 스타일, 깔끔한 선화
  # watercolor: 수채화 스타일, 부드러운 질감
  # photorealistic: 사실적 사진, 8K 품질

i2v:
  model: "kling-v2-6"        # kling-v1-6, kling-v2-6, kling-v3
  duration: 5                 # 5 또는 10초
  mode: "std"                 # std (빠름) 또는 pro (고품질)
  cfg_scale: 0.5              # 프롬프트 충실도 (0~1)
  i2v_ratio: 0.2              # 전체 씬 중 I2V 비율 (PRD 권장: 20%)
  poll_interval: 10           # 폴링 간격 (초)
  timeout: 600                # 생성 타임아웃 (초)

video:
  resolution: "1920x1080"
  fps: 30
  crf: 18
  crf_intermediate: 12        # 중간 클립용 (재인코딩 품질 보존)
  min_bitrate: "4M"            # 최소 비트레이트 (유튜브 1080p 권장: 8M)
  max_bitrate: "12M"           # 최대 비트레이트
  bufsize: "16M"               # VBV 버퍼 크기
  preset: "medium"
  font_name: "Malgun Gothic"
  font_size: 24
  subtitle_margin_v: 40
  transition_duration: 0.5     # 씬 전환 페이드 (초)
  bgm_dir: "bgm"              # BGM 파일 폴더 (mp3/wav)
  bgm_volume: 0.05            # BGM 볼륨 (나레이션 대비, 0.03~0.10 권장)

thumbnail:
  width: 1280
  height: 720
  font_path: "C:/Windows/Fonts/malgunbd.ttf"
  font_size: 64

youtube:
  category_id: "22"
  privacy_status: "private"
  default_language: "ko"
  # 예약 발행: "18:00" 형식 (다음 해당 시각에 공개), 비워두면 즉시
  schedule_time: ""
